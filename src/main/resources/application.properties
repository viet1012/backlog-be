spring.application.name=backlog-be
server.port=8080

spring.datasource.url= jdbc:sqlserver://192.168.122.2:1433;databaseName=F2Database;encrypt=false;trustServerCertificate=true
spring.datasource.username=admin
spring.datasource.password=Buitanphat0201@
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jackson.serialization.write-dates-as-timestamps=false

# Machine Monitor - tab An toàn: plant của F2_Patrol_Report (phân cách bằng dấu phẩy)
machine-monitor.hse.plants=Fac_2
# Division của F2_Patrol_Report -> floorId, dùng cho lỗi không gắn máy (division=floorId, phân cách bằng dấu phẩy)
machine-monitor.hse.division-floor=KVH-Press=factoryA-f1, KVH-Guide=factoryB-f1, KVH-Mold=factoryC-f1

# Assistant (mascot) - LLM nội bộ LM Studio, API OpenAI-compatible
assistant.llm.base-url=http://192.168.122.16:1234/v1
assistant.llm.model=openai/gpt-oss-20b
assistant.llm.timeout-seconds=180
assistant.llm.max-tokens=3000
assistant.llm.temperature=0.2
assistant.llm.max-concurrent=4
# Để trống = không gửi reasoning_effort (mức suy luận đặt trong system prompt: "Reasoning: low")
assistant.llm.reasoning-effort=
# Tên mascot AI (prompt + FE qua GET /api/assistant/config). Viết \uXXXX cho ký tự có dấu (.properties đọc ISO-8859-1)
assistant.name=AI Assistant
assistant.template-answers.enabled=true
