spring.application.name=backlog-be
server.port=8080

spring.datasource.url= jdbc:sqlserver://192.168.122.2:1433;databaseName=F2Database;encrypt=false;trustServerCertificate=true
spring.datasource.username=admin
spring.datasource.password=Buitanphat0201@
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jackson.serialization.write-dates-as-timestamps=false

# Machine Monitor - tab An toàn: plant của F2_Patrol_Report (phân cách bằng dấu phẩy)
machine-monitor.hse.plants=Fac_2
# Division của F2_Patrol_Report -> floorId, dùng cho lỗi không gắn máy (division=floorId, phân cách bằng dấu phẩy)
machine-monitor.hse.division-floor=KVH-Press=factoryA-f1, KVH-Guide=factoryB-f1, KVH-Mold=factoryC-f1

# Assistant (mascot) - LLM nội bộ LM Studio, API OpenAI-compatible
assistant.llm.base-url=http://192.168.122.16:1234/v1
assistant.llm.model=openai/gpt-oss-20b
assistant.llm.timeout-seconds=180
assistant.llm.max-tokens=3000
assistant.llm.temperature=0.2
assistant.llm.max-concurrent=4
# Het suat: cho toi da (giay) truoc khi tra 503 LLM_BUSY; so cau hoi duoc xep hang cung luc
assistant.llm.queue-timeout-seconds=30
assistant.llm.max-queue=16
# Rate limit /api/assistant/chat theo ma nhan vien (khong co thi theo IP): moi request / chi request goi LLM
assistant.rate-limit.per-minute=60
assistant.rate-limit.llm-per-minute=15
# Để trống = không gửi reasoning_effort (mức suy luận đặt trong system prompt: "Reasoning: low")
assistant.llm.reasoning-effort=
# Tên mascot AI (prompt + FE qua GET /api/assistant/config). Viết \uXXXX cho ký tự có dấu (.properties đọc ISO-8859-1)
assistant.name=AI Assistant
assistant.template-answers.enabled=true


spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

cost-monitoring.ot.share-path=//192.168.0.6/dtp/9_Daily Costmonitoring/FY26 Daily Cost monitoning_FY26.xlsx
# Tùy chọn, tự nạp: phút 15 mỗi giờ từ 8h–18h, thứ 2–7. File không đổi thì bỏ qua.
cost-monitoring.ot.share-cron=0 15 8-18 * * MON-SAT

# Xác thực / phân quyền (F2_ProductionControl_Session, vw_F2_ProductionControl_EmpPerm)
# false: không chặn, chỉ log WARN "would-deny"; true: thiếu/sai token -> 401, thiếu quyền -> 403
auth.enforce=false
# false: POST /api/production-control/auth/register trả 403
auth.register.enabled=false

# Origin FE được gọi API, cách nhau dấu phẩy (nhận pattern, vd http://192.168.0.*:5173). Trống = chặn mọi cross-origin.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173