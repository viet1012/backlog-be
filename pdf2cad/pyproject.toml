[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2cad"
version = "0.1.0"
description = "Chuyển bản vẽ PDF (vector & scan) sang DXF 2D; nền tảng cho dựng 3D"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "ezdxf>=1.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
# OCR: Windows dùng onnxruntime-directml (chạy được cả GPU Intel/AMD/NVIDIA lẫn CPU) -> ưu tiên GPU.
# Không cài chung với onnxruntime (CPU): 2 gói cùng tên module, gói sau ghi đè gói trước.
raster = ["opencv-python-headless>=4.9"]
ocr = ["rapidocr>=3.4", "onnxruntime-directml>=1.17; sys_platform == 'win32'", "onnxruntime>=1.17; sys_platform != 'win32'", "opencv-python-headless>=4.9"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9",
       "opencv-python-headless>=4.9", "rapidocr>=3.4", "onnxruntime-directml>=1.17; sys_platform == 'win32'", "onnxruntime>=1.17; sys_platform != 'win32'"]
gui = ["PySide6>=6.6", "opencv-python-headless>=4.9", "rapidocr>=3.4", "onnxruntime-directml>=1.17; sys_platform == 'win32'", "onnxruntime>=1.17; sys_platform != 'win32'"]
bench = ["pypdfium2>=4.30"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "rapidocr>=3.4", "onnxruntime-directml>=1.17; sys_platform == 'win32'", "onnxruntime>=1.17; sys_platform != 'win32'", "reportlab>=4.0", "opencv-python-headless>=4.9", "pypdfium2>=4.30"]

[project.scripts]
pdf2cad = "pdf2cad.cli:main"
pdf2cad-web = "pdf2cad.web.app:main"

[project.gui-scripts]
pdf2cad-gui = "pdf2cad.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf2cad = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
